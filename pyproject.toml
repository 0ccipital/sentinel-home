[project]
name = "sentinel-home"
version = "1.0.0-dev"
description = "Home network security & health monitor"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "scapy>=2.6",
    "python-nmap>=0.6",
    "apscheduler>=3.10",
    "sse-starlette>=2.0",
    "mac-vendor-lookup>=0.1",
    "apprise>=1.9",
    "python-multipart>=0.0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_home"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
sentinel-home = "sentinel_home.main:run"
